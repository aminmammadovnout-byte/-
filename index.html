<header><h1>📋 Учёт пропусков</h1><div class="sub">Просмотр пропущенных часов по предметам</div></header>
<div class="wrap">
<div class="mode">

: 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "мурад": {"биохимия": 4, "омп": 0, "англ в иностранной": 0, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "иман": {"биохимия": 0, "омп": 2, "англ в иностранной": 2, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 2}, "айсу": {"биохимия": 0, "омп": 0, "англ в иностранной": 0, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "айла": {"биохимия": 0, "омп": 0, "англ в иностранной": 0, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "амин": {"биохимия": 0, "омп": 0, "англ в иностранной": 0, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "хабиба": {"биохимия": 4, "омп": 4, "англ в иностранной": 2, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "айлин": {"биохимия": 0, "омп": 4, "англ в иностранной": 0, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "фатя": {"биохимия": 0, "омп": 2, "англ в иностранной": 0, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "софия": {"биохимия": 0, "омп": 0, "англ в иностранной": 2, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}, "зарифа": {"биохимия": 0, "омп": 2, "англ в иностранной": 0, "псих педагог": 0, "гигиена": 0, "сестринское": 0, "оцз": 0, "норфиз": 0, "философ": 0, "микра": 0, "азерб": 0}}};
const ADMIN_PASSWORD = "F01admin";
let state = JSON.parse(JSON.stringify(INITIAL));
let mode = "student", selectedStudent = null, loggedIn = false;
let dbReady = false;
let rows = [];

function today(){return new Date().toISOString().slice(0,10)}
function names(){return Object.keys(state.data).sort((a,b)=>a.localeCompare(b,"ru"))}
function total(name){return Object.values(state.data[name]||{}).reduce((a,b)=>a+(Number(b)||0),0)}
function cls(n){return n===0?"zero":n<=4?"mid":"high"}
function save(){localStorage.setItem("attendanceData",JSON.stringify(state))}

function rebuildState(data){
  const subjects=[...new Set(data.map(r=>r.subject).filter(Boolean))];
  const namesList=[...new Set(data.map(r=>r.student_name).filter(Boolean))];
  if(!namesList.length)return null;

  const next={
    subjects:subjects.length?subjects:INITIAL.subjects.slice(),
    data:{},
    limits:{},
    statuses:{}
  };

  namesList.forEach(n=>{
    next.data[n]={};
    next.statuses[n]={};
    next.subjects.forEach(s=>next.data[n][s]=0);
  });

  data.forEach(r=>{
    if(!r.student_name||!r.subject)return;

    if(!next.data[r.student_name]){
      next.data[r.student_name]={};
      next.statuses[r.student_name]={};
      next.subjects.forEach(s=>next.data[r.student_name][s]=0);
    }

    // Считаем только пропущенные часы.
    if(r.present===false){
      next.data[r.student_name][r.subject]+=Number(r.hours)||0;
    }

    // Берём лимит и статус из Supabase.
    if(r.limit!=null && next.limits[r.subject]==null){
      next.limits[r.subject]=Number(r.limit);
    }

    if(r.status){
      next.statuses[r.student_name][r.subject]=r.status;
    }
  });

  // Если статус почему-то не записан в БД, рассчитываем его по лимиту.
  Object.keys(next.data).forEach(n=>{
    next.subjects.forEach(s=>{
      if(next.statuses[n][s])return;
      const limit=next.limits[s];
      if(limit==null)return;
      const missed=next.data[n][s];
      next.statuses[n][s]=
        missed>=limit ? "Лимит превышен" :
        missed>=limit*0.8 ? "Близко к лимиту" :
        "Норма";
    });
  });

  return next;
}

async function loadFromSupabase(){
  const {data,error}=await db.from("attendance").select("id,student_name,date,present,subject,hours,limit,status").order("id");
  if(error) throw error;
  rows=data||[];
  const {data: subjectRows, error: subjectError} =
await db.from("subjects").select("subject,is_active");

if(subjectError) throw subjectError;

state.subjectStatus = {};
(subjectRows || []).forEach(x => {
state.subjectStatus[x.subject] = x.is_active;
})
  if(rows.length){
    const remote=rebuildState(rows);
    if(remote){state=remote;save();dbReady=true;renderStudent();if(loggedIn)renderAdmin();return;}
  }
  await seedInitial();
}

async function seedInitial(){
  const records=[];
  Object.entries(INITIAL.data).forEach(([name,subjects])=>{
    Object.entries(subjects).forEach(([subject,hours])=>{
      const h=Number(hours)||0;
      records.push({student_name:name,subject,date:today(),present:h===0,hours:h});
    });
  });
  const {data,error}=await db.from("attendance").insert(records).select("id,student_name,date,present,subject,hours");
  if(error){alert("Не удалось загрузить начальные данные: "+error.message);return}
  rows=data||[];
  state=JSON.parse(JSON.stringify(INITIAL));save();dbReady=true;renderStudent();if(loggedIn)renderAdmin();
}

async function change(n,s,delta){
  if(!dbReady){alert("База данных ещё загружается. Подожди немного.");return}
  const target=rows.find(r=>r.student_name===n&&r.subject===s);
  if(!target){alert("Запись для этого студента и предмета не найдена.");return}
  const current=Number(target.hours)||0;
  const next=Math.max(0,current+delta);
  if(next===current)return;
  const {data,error}=await db.from("attendance").update({hours:next,present:next===0,date:today()}).eq("id",target.id).select("id,student_name,date,present,subject,hours,limit,status").single();
  if(error){alert("Не удалось сохранить: "+error.message);return}
  Object.assign(target,data);
  const remote=rebuildState(rows);
  if(remote)state=remote;
  save();renderAdmin();if(selectedStudent===n)renderStudent();
}

async function addStudent(){
  const n=prompt("Имя студента:");if(!n)return;
  if(state.data[n])return alert("Такой студент уже есть.");
  const records=state.subjects.map(subject=>({student_name:n,subject,date:today(),present:true,hours:0}));
  const {data,error}=await db.from("attendance").insert(records).select("id,student_name,date,present,subject,hours");
  if(error){alert("Не удалось сохранить: "+error.message);return}
  rows.push(...data);rebuildAndRender();
}
async function addSubject(){
  const s=prompt("Название предмета:");if(!s)return;
  if(state.subjects.includes(s))return alert("Такой предмет уже есть.");
  const records=names().map(n=>({student_name:n,subject:s,date:today(),present:true,hours:0}));
  const {data,error}=await db.from("attendance").insert(records).select("id,student_name,date,present,subject,hours");
  if(error){alert("Не удалось сохранить: "+error.message);return}
  rows.push(...data);rebuildAndRender();
}
function rebuildAndRender(){const remote=rebuildState(rows);if(remote)state=remote;save();renderAdmin();renderStudent()}
function downloadJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="uchet-propuskov-backup.json";a.click();URL.revokeObjectURL(a.href);}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function js(x){return String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}

function setMode(m){
  mode=m;
  document.getElementById("studentCard").classList.toggle("hidden",m!=="student");
  document.getElementById("adminCard").classList.toggle("hidden",m!=="admin");
  document.getElementById("studentMode").className=m==="student"?"primary":"secondary";
  document.getElementById("adminMode").className=m==="admin"?"primary":"secondary";
  if(m==="admin"&&!loggedIn)document.getElementById("password").focus();
  if(m==="student")renderStudent();
}
function filterNames(){
  const input=document.getElementById("studentSearch"),box=document.getElementById("results"),clear=document.getElementById("clearSearch");
  const q=input.value.trim().toLocaleLowerCase("ru-RU");
  const list=names().filter(n=>n.toLocaleLowerCase("ru-RU").includes(q));
  box.innerHTML="";clear.style.display=input.value?"block":"none";
  list.forEach(n=>{const b=document.createElement("button");b.type="button";b.textContent=n;b.onclick=()=>selectStudent(n);box.appendChild(b);});
  box.style.display="block";
  if(!list.length)box.innerHTML='<div style="padding:14px;color:#697386">Ничего не найдено</div>';
}
function selectStudent(n){selectedStudent=n;document.getElementById("studentSearch").value=n;document.getElementById("results").style.display="none";renderStudent()}
function renderStudent(){
  const v=document.getElementById("studentView");
  if(!selectedStudent){v.innerHTML='<div class="notice">Выбери своё имя из списка — здесь появятся только твои пропуски.</div>';return}
  const d=state.data[selectedStudent]||{};
  const statuses=state.statuses?.[selectedStudent]||{};
  let s=`<div class="student-head"><h2>${esc(selectedStudent)}</h2><div class="total"><span class="badge ${cls(total(selectedStudent))}">${total(selectedStudent)} ч.</span></div></div>`;

  s+=Object.entries(d).map(([sub,n])=>{
   const limit=state.limits?.[sub];
const subjectActive = state.subjectStatus?.[sub] !== false;

const status = !subjectActive
? "Дисциплина завершена"
: (statuses[sub] || "Норма");

const statusClass =
status==="Лимит превышен"
? "status-over"
: status==="Близко к лимиту"
? "status-near"
: "";

const limitText = limit!=null ? ` / ${limit} ч.` : "";
    return `<div class="subject">
      <div class="subject-info">
        <span class="subject-name">${esc(sub)}</span>
        <span class="subject-meta">${n} ч.${limitText}</span>
        <span class="status ${statusClass}">${esc(status)}</span>
      </div>
      <span class="num">${n}</span>
    </div>`;
  }).join("");

  v.innerHTML=s;
}
function login(){
  if(document.getElementById("password").value===ADMIN_PASSWORD){
    loggedIn=true;document.getElementById("loginBox").classList.add("hidden");document.getElementById("adminPanel").classList.remove("hidden");renderAdmin();
  }else document.getElementById("loginError").textContent="Неверный пароль.";
}
function logout(){loggedIn=false;document.getElementById("loginBox").classList.remove("hidden");document.getElementById("adminPanel").classList.add("hidden");document.getElementById("password").value=""}
async function toggleSubjectStatus(subject){
const current = state.subjectStatus?.[subject] !== false;
const newStatus = !current;

const { error } = await db
.from("subjects")
.update({ is_active: newStatus })
.eq("subject", subject);

if(error){
alert("Не удалось изменить статус: " + error.message);
return;
}

if(!state.subjectStatus) state.subjectStatus = {};
state.subjectStatus[subject] = newStatus;

renderAdmin();
renderStudent();
}
  function renderAdmin(){
let h='<div class="tablewrap"><table><thead><tr><th>Студент</th>';

state.subjects.forEach(s=>{
const active = state.subjectStatus?.[s] !== false;
h+=`<th>${esc(s)}
<div class="controls">
<button class="${active ? 'mini' : 'danger'}"
onclick="toggleSubjectStatus('${js(s)}')">
${active ? 'Завершить' : 'Возобновить'}
</button>
</div>
</th>`;
});

h+='<th>Итого</th></tr></thead><tbody>';

names().forEach(n=>{
h+=`<tr><td><b>${esc(n)}</b></td>`;

state.subjects.forEach(s=>{
h+=`<td><div class="controls">`;

if(state.subjectStatus?.[s] === false){
h+=`<span class="status">Завершена</span>`;
}else{
h+=`<button class="mini" onclick="change('${js(n)}','${js(s)}',-1)">−</button>`;
h+=`<button class="mini" onclick="change('${js(n)}','${js(s)}',1)">+</button>`;
}

h+=`</div></td>`;
});

h+=`<td><b>${total(n)}</b></td></tr>`;
});

h+='</tbody></table></div>';
document.getElementById("adminTable").innerHTML=h;
}
const searchInput=document.getElementById("studentSearch");
searchInput.addEventListener("input",filterNames);
searchInput.addEventListener("focus",filterNames);
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter"){const q=searchInput.value.trim().toLocaleLowerCase("ru-RU");const first=names().find(n=>n.toLocaleLowerCase("ru-RU").includes(q));if(first)selectStudent(first)}});
document.getElementById("clearSearch").addEventListener("click",()=>{searchInput.value="";selectedStudent=null;filterNames();searchInput.focus();renderStudent()});
document.addEventListener("click",e=>{if(!e.target.closest(".searchbox"))document.getElementById("results").style.display="none"});

renderStudent();
loadFromSupabase().catch(error=>{
  console.error(error);
  const msg=error.message||String(error);
  document.getElementById("studentView").innerHTML='<div class="notice error">Ошибка подключения к Supabase: '+esc(msg)+'</div>';
});
</script>
</body>
</html>
